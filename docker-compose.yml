# Project name is pinned so volume/network names do not follow the
# directory name on the Pi (`nau-web` vs `NAU-Web`).
name: nau-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Actions publishes this. Override with NAU_IMAGE=nau-web:latest
    # if you are deploying a locally built image via deploy.sh.
    image: ${NAU_IMAGE:-ghcr.io/stephanie569/nau-web:latest}
    container_name: nau-web
    restart: unless-stopped
    ports:
      - "48100:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      # Checkout and contact mail read these at request time. Empty is
      # fine — the site still serves. Set secrets in $REMOTE_DIR/.env on
      # the Pi (deploy does not overwrite that file).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-info@naustudio.org}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_FROM: ${CONTACT_FROM:-info@naustudio.org}
      CONTACT_TO: ${CONTACT_TO:-info@naustudio.org}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
