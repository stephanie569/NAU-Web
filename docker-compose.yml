# Project name is pinned so volume/network names do not follow the
# directory name on the Pi (`nau-web` vs `NAU-Web`).
name: nau-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nau-web:latest
    container_name: nau-web
    restart: unless-stopped
    ports:
      - "48100:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      # Checkout reads this at request time. Empty is fine — the site
      # still serves. Set STRIPE_SECRET_KEY in $REMOTE_DIR/.env on the Pi
      # (deploy.sh does not overwrite that file).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
