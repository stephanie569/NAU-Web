# Cloud runner builds linux/arm64 and pushes to GHCR.
# A self-hosted runner on the Pi (default labels: self-hosted, Linux, ARM64)
# then pulls that image and recreates the compose service.
#
# Do not add pull_request triggers. This repo is public and the deploy
# job runs on a machine on a private network.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nau-web-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PI_APP_DIR: /home/svetlozarstoikov/apps/nau-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'stephanie569/NAU-Web'
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull image and recreate container
        env:
          NAU_IMAGE: ${{ needs.build.outputs.image }}:latest
        run: |
          set -euo pipefail
          mkdir -p "${PI_APP_DIR}"
          cp docker-compose.yml "${PI_APP_DIR}/docker-compose.yml"
          cd "${PI_APP_DIR}"
          docker compose pull web
          docker compose up -d --remove-orphans
          docker image prune -f
