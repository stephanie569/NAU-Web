# GitHub-hosted ARM runner builds linux/arm64 natively and pushes to GHCR.
# The Pi deploys itself: a systemd timer there (see deploy/pi/) pulls
# :latest every 2 minutes and recreates the compose service when the image
# changed. A green run here means the image was published, not that it is
# live yet; check `journalctl -u nau-web-update` on the Pi for deploys.
#
# There is deliberately no self-hosted runner. Its registration is deleted
# by GitHub whenever the Pi is offline for a couple of weeks, which left
# deploy jobs queued for 24h and then cancelled.

name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nau-web-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
